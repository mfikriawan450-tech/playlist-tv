name: Test Trans7 Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Test Trans7 Session
        run: |
          node scripts/test-trans7-session.mjs

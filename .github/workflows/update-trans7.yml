name: Test Trans7 URL

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Trans7 direct HLS
        run: |
          URL="https://video.detik.com/trans7/smil:trans7.smil/playlist.m3u8"

          echo "Testing:"
          echo "$URL"
          echo ""

          curl -L \
            --fail \
            --max-time 30 \
            -D headers.txt \
            "$URL" \
            -o trans7.m3u8

          echo ""
          echo "================================="
          echo "HTTP HEADERS"
          echo "================================="
          cat headers.txt

          echo ""
          echo "================================="
          echo "M3U8 CONTENT"
          echo "================================="
          head -30 trans7.m3u8

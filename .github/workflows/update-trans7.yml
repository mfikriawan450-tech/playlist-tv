name: Test Trans7

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Run Trans7 detector
        run: |
          node scripts/update-trans7.mjs

      - name: Show playlist
        run: |
          echo "================================="
          echo "ISI os4.m3u"
          echo "================================="
          cat os4.m3u

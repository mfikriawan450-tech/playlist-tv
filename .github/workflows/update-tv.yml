name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show updated playlist
        run: |
          echo "================================="
          echo "ISI os4.m3u"
          echo "================================="
          cat os4.m3u

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================="
          echo "CEK FILE TRANS7"
          echo "================================="

          echo "Isi stream-trans7.txt:"
          cat stream-trans7.txt || true

          echo ""
          echo "================================="
          echo "STATUS GIT"
          echo "================================="

          git status --short

          echo ""
          echo "================================="
          echo "MENAMBAHKAN FILE"
          echo "================================="

          git add os4.m3u
          git add stream-rcti.txt
          git add stream-mnctv.txt
          git add stream-gtv.txt
          git add stream-trans7.txt

          echo ""
          echo "================================="
          echo "PERUBAHAN YANG AKAN DI-COMMIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

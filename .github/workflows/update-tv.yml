name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # SIMPAN os4.m3u SEBELUM UPDATE
      # ==========================================

      - name: Backup playlist lama
        run: |
          cp os4.m3u os4.m3u.before

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # BUILD os4.m3u
      #
      # RCTI / MNCTV / GTV:
      # URL diambil dari file hasil update-rcti.mjs
      #
      # Trans7:
      # sudah di-update langsung oleh update-trans7.mjs
      # ==========================================

      - name: Update RCTI MNCTV GTV in os4.m3u
        env:
          REFERRER: "https://www.rctiplus.com/"
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
        run: |
          RCTI_URL="$(cat stream-rcti.txt)"
          MNCTV_URL="$(cat stream-mnctv.txt)"
          GTV_URL="$(cat stream-gtv.txt)"

          if [ -z "$RCTI_URL" ]; then
            echo "ERROR: RCTI URL kosong."
            exit 1
          fi

          if [ -z "$MNCTV_URL" ]; then
            echo "ERROR: MNCTV URL kosong."
            exit 1
          fi

          if [ -z "$GTV_URL" ]; then
            echo "ERROR: GTV URL kosong."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("os4.m3u")
          text = path.read_text(encoding="utf-8")

          rcti_url = Path("stream-rcti.txt").read_text(
              encoding="utf-8"
          ).strip()

          mnctv_url = Path("stream-mnctv.txt").read_text(
              encoding="utf-8"
          ).strip()

          gtv_url = Path("stream-gtv.txt").read_text(
              encoding="utf-8"
          ).strip()

          referrer = "https://www.rctiplus.com/"

          user_agent = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          def replace_channel(text, channel, url, with_headers=False):
              pattern = re.compile(
                  rf"(?ms)^#EXTINF:-1,{re.escape(channel)}\s*$.*?(?=^#EXTINF|\Z)"
              )

              if not pattern.search(text):
                  raise RuntimeError(
                      f"Channel {channel} tidak ditemukan di os4.m3u"
                  )

              if with_headers:
                  block = (
                      f"#EXTINF:-1,{channel}\n"
                      f"#EXTVLCOPT:http-referrer={referrer}\n"
                      f"#EXTVLCOPT:http-user-agent={user_agent}\n"
                      f"{url}\n\n"
                  )
              else:
                  block = (
                      f"#EXTINF:-1,{channel}\n"
                      f"{url}\n\n"
                  )

              return pattern.sub(block, text, count=1)

          # ==========================================
          # HANYA RCTI / MNCTV / GTV YANG DIUBAH
          # ==========================================

          text = replace_channel(
              text,
              "RCTI",
              rcti_url,
              True
          )

          text = replace_channel(
              text,
              "MNCTV",
              mnctv_url,
              True
          )

          text = replace_channel(
              text,
              "GTV",
              gtv_url,
              True
          )

          # ==========================================
          # TRANS7 SENGAJA TIDAK DISENTUH
          # ==========================================

          path.write_text(
              text.rstrip() + "\n",
              encoding="utf-8"
          )

          print("=================================")
          print("RCTI / MNCTV / GTV DIPERBARUI")
          print("=================================")
          print("Trans7 dipertahankan apa adanya dari update-trans7.mjs.")
          PY

          echo ""
          echo "================================="
          echo "HASIL os4.m3u"
          echo "================================="
          cat os4.m3u
      # ==========================================
      # CEK PERUBAHAN PER CHANNEL
      # ==========================================

      - name: Compare channels
        run: |
          python3 <<'PY'
          from pathlib import Path

          old = Path("os4.m3u.before").read_text(
              encoding="utf-8"
          ).splitlines()

          new = Path("os4.m3u").read_text(
              encoding="utf-8"
          ).splitlines()

          channels = [
              "Trans7",
              "RCTI",
              "MNCTV",
              "GTV",
          ]

          def get_url(lines, channel):
              for i, line in enumerate(lines):
                  if line.strip() == f"#EXTINF:-1,{channel}":
                      for next_line in lines[i + 1:]:
                          value = next_line.strip()

                          if value.startswith(
                              "http://"
                          ) or value.startswith(
                              "https://"
                          ):
                              return value

                          if value.startswith("#EXTINF"):
                              break

              return None

          changed = []

          for channel in channels:
              old_url = get_url(old, channel)
              new_url = get_url(new, channel)

              print("=================================")
              print(channel)
              print("=================================")
              print("URL LAMA:")
              print(old_url)
              print()
              print("URL BARU:")
              print(new_url)
              print()

              if old_url == new_url:
                  print("STATUS: TIDAK BERUBAH")
              else:
                  print("STATUS: BERUBAH")
                  changed.append(channel)

              print()

          print("=================================")
          print("RINGKASAN PERUBAHAN")
          print("=================================")

          if changed:
              print("Channel yang berubah:")
              for channel in changed:
                  print(f"- {channel}")
          else:
              print("Tidak ada URL channel yang berubah.")

          # Simpan daftar channel yang berubah
          Path("changed-channels.txt").write_text(
              "\n".join(changed) + "\n"
              if changed
              else "",
              encoding="utf-8"
          )
          PY

      # ==========================================
      # SHOW FINAL PLAYLIST
      # ==========================================

      - name: Show final playlist
        run: |
          echo "================================="
          echo "os4.m3u FINAL"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "CHANNEL YANG BERUBAH"
          echo "================================="

          if [ -s changed-channels.txt ]; then
            cat changed-channels.txt
          else
            echo "Tidak ada channel berubah."
          fi

      # ==========================================
      # COMMIT HANYA JIKA ADA URL BERUBAH
      # ==========================================

      - name: Commit and push
        run: |
          if [ ! -s changed-channels.txt ]; then
            echo "================================="
            echo "TIDAK ADA PERUBAHAN URL"
            echo "================================="
            echo "Tidak membuat commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add os4.m3u

          echo "================================="
          echo "CHANNEL BERUBAH"
          echo "================================="
          cat changed-channels.txt

          echo ""
          echo "================================="
          echo "PERUBAHAN GIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

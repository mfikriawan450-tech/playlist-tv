name: Update TV Streams

on:
  workflow_dispatch:

  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # BUILD FINAL os4.m3u
      # ==========================================

      - name: Build os4.m3u
        env:
          REFERRER: "https://www.rctiplus.com/"
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
        run: |
          RCTI_URL=$(cat stream-rcti.txt)
          MNCTV_URL=$(cat stream-mnctv.txt)
          GTV_URL=$(cat stream-gtv.txt)

          TRANS7_URL=$(awk '
            found {
              if ($0 ~ /^https?:\/\//) {
                print $0
                exit
              }
            }
            /^#EXTINF:-1,Trans7$/ {
              found=1
            }
          ' os4.m3u)

          if [ -z "$RCTI_URL" ]; then
            echo "RCTI URL tidak ditemukan"
            exit 1
          fi

          if [ -z "$MNCTV_URL" ]; then
            echo "MNCTV URL tidak ditemukan"
            exit 1
          fi

          if [ -z "$GTV_URL" ]; then
            echo "GTV URL tidak ditemukan"
            exit 1
          fi

          if [ -z "$TRANS7_URL" ]; then
            echo "Trans7 URL tidak ditemukan"
            exit 1
          fi

          cat > os4.m3u <<EOF
          #EXTM3U

          #EXTINF:-1,Trans TV
          https://livestream.transtv.co.id/stream/live/ttv.m3u8

          #EXTINF:-1,Trans7
          $TRANS7_URL

          #EXTINF:-1,RCTI
          #EXTVLCOPT:http-referrer=$REFERRER
          #EXTVLCOPT:http-user-agent=$USER_AGENT
          $RCTI_URL

          #EXTINF:-1,MNCTV
          #EXTVLCOPT:http-referrer=$REFERRER
          #EXTVLCOPT:http-user-agent=$USER_AGENT
          $MNCTV_URL

          #EXTINF:-1,GTV
          #EXTVLCOPT:http-referrer=$REFERRER
          #EXTVLCOPT:http-user-agent=$USER_AGENT
          $GTV_URL

          #EXTINF:-1,TVRI Nasional
          https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8

          #EXTINF:-1,Metro TV
          https://edge-medcom.streamized.net/live-edge/smil:metro.smil/playlist.m3u8
          EOF

          echo "================================="
          echo "os4.m3u BERHASIL DIBUAT"
          echo "================================="

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show final playlist
        run: |
          echo "================================="
          echo "ISI FINAL os4.m3u"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "RCTI"
          echo "================================="
          cat stream-rcti.txt

          echo ""
          echo "================================="
          echo "MNCTV"
          echo "================================="
          cat stream-mnctv.txt

          echo ""
          echo "================================="
          echo "GTV"
          echo "================================="
          cat stream-gtv.txt

          echo ""
          echo "================================="
          echo "TRANS7"
          echo "================================="
          grep -A1 "^#EXTINF:-1,Trans7" os4.m3u

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add os4.m3u

          echo "================================="
          echo "PERUBAHAN"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

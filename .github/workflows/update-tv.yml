name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # FORMAT STREAM FILES
      #
      # stream-*.txt:
      # header tetap
      # URL asli selalu dari hasil update-rcti.mjs
      # ==========================================

      - name: Format stream files RCTI MNCTV GTV
        run: |
          python3 <<'PY'
          from pathlib import Path

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          REFERRER = "https://www.rctiplus.com/"

          channels = {
              "RCTI": "stream-rcti.txt",
              "MNCTV": "stream-mnctv.txt",
              "GTV": "stream-gtv.txt",
          }

          for channel, filename in channels.items():
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      f"File {filename} tidak ditemukan."
                  )

              # ======================================
              # Ambil URL ASLI dari hasil
              # update-rcti.mjs
              # ======================================

              lines = path.read_text(
                  encoding="utf-8"
              ).splitlines()

              stream_url = None

              for line in lines:
                  line = line.strip()

                  if not line:
                      continue

                  # Lewati metadata/header lama
                  if line.startswith("#"):
                      continue

                  if line.startswith("http://") or line.startswith("https://"):
                      # Ambil URL terakhir yang ditemukan
                      stream_url = line

              if not stream_url:
                  raise RuntimeError(
                      f"URL stream {channel} tidak ditemukan "
                      f"di {filename}."
                  )

              # ======================================
              # Tulis ulang file dengan format tetap
              # ======================================

              content = (
                  "#EXTM3U\n"
                  f"#EXTINF:-1,{channel}\n"
                  f"#EXTVLCOPT:http-referrer={REFERRER}\n"
                  f"#EXTVLCOPT:http-user-agent={USER_AGENT}\n"
                  f"{stream_url}\n"
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

              print("=================================")
              print(f"{channel}")
              print("=================================")
              print("URL ASLI:")
              print(stream_url)
              print(f"FILE: {filename}")
              print()

          print("=================================")
          print("SEMUA STREAM FILE BERHASIL DIFORMAT")
          print("=================================")
          PY

      # ==========================================
      # BERSIHKAN os4.m3u
      #
      # RCTI/MNCTV/GTV = URL WORKER SAJA
      # ==========================================

      - name: Update os4.m3u
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("os4.m3u")

          text = path.read_text(
              encoding="utf-8"
          )

          workers = {
              "RCTI":
                  "https://iptv-gateway.mfikriawan450.workers.dev/rcti",

              "MNCTV":
                  "https://iptv-gateway.mfikriawan450.workers.dev/mnctv",

              "GTV":
                  "https://iptv-gateway.mfikriawan450.workers.dev/gtv",
          }

          for channel, worker_url in workers.items():

              pattern = re.compile(
                  rf"(?ms)"
                  rf"^#EXTINF:-1,{re.escape(channel)}\s*$"
                  rf".*?"
                  rf"(?=^#EXTINF|\Z)"
              )

              replacement = (
                  f"#EXTINF:-1,{channel}\n"
                  f"{worker_url}\n\n"
              )

              if not pattern.search(text):
                  raise RuntimeError(
                      f"Channel {channel} tidak ditemukan di os4.m3u"
                  )

              text = pattern.sub(
                  replacement,
                  text
              )

          path.write_text(
              text.rstrip() + "\n",
              encoding="utf-8"
          )

          print("=================================")
          print("os4.m3u BERHASIL DIPERBARUI")
          print("=================================")
          PY

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show updated files
        run: |
          echo "================================="
          echo "ISI os4.m3u"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "ISI stream-rcti.txt"
          echo "================================="
          cat stream-rcti.txt

          echo ""
          echo "================================="
          echo "ISI stream-mnctv.txt"
          echo "================================="
          cat stream-mnctv.txt

          echo ""
          echo "================================="
          echo "ISI stream-gtv.txt"
          echo "================================="
          cat stream-gtv.txt

          echo ""
          echo "================================="
          echo "ISI stream-trans7.txt"
          echo "================================="
          cat stream-trans7.txt

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================="
          echo "STATUS GIT"
          echo "================================="

          git status --short

          echo ""
          echo "================================="
          echo "MENAMBAHKAN FILE"
          echo "================================="

          git add os4.m3u
          git add stream-rcti.txt
          git add stream-mnctv.txt
          git add stream-gtv.txt
          git add stream-trans7.txt

          echo ""
          echo "================================="
          echo "PERUBAHAN YANG AKAN DI-COMMIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # UPDATE os4.m3u
      #
      # RCTI/MNCTV/GTV:
      # langsung memakai URL ASLI terbaru
      #
      # Tidak menggunakan Worker
      # ==========================================

      - name: Build os4.m3u
        run: |
          python3 <<'PY'
          from pathlib import Path

          REFERRER = "https://www.rctiplus.com/"

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          def read_url(filename, channel):
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      f"{filename} tidak ditemukan."
                  )

              for line in path.read_text(
                  encoding="utf-8"
              ).splitlines():

                  line = line.strip()

                  if (
                      line.startswith("http://")
                      or line.startswith("https://")
                  ):
                      return line

              raise RuntimeError(
                  f"URL {channel} tidak ditemukan di {filename}."
              )

          # ==========================================
          # AMBIL URL ASLI HASIL update-rcti.mjs
          # ==========================================

          rcti_url = read_url(
              "stream-rcti.txt",
              "RCTI"
          )

          mnctv_url = read_url(
              "stream-mnctv.txt",
              "MNCTV"
          )

          gtv_url = read_url(
              "stream-gtv.txt",
              "GTV"
          )

          # ==========================================
          # BACA os4.m3u YANG SUDAH DIUBAH update-trans7
          # ==========================================

          trans7_url = None

          os4_old = Path("os4.m3u")

          if os4_old.exists():

              lines = os4_old.read_text(
                  encoding="utf-8"
              ).splitlines()

              current = None

              for line in lines:

                  stripped = line.strip()

                  if stripped.startswith(
                      "#EXTINF:-1,Trans7"
                  ):
                      current = "Trans7"
                      continue

                  if current == "Trans7":

                      if (
                          stripped.startswith("http://")
                          or stripped.startswith("https://")
                      ):
                          trans7_url = stripped
                          break

          if not trans7_url:
              raise RuntimeError(
                  "URL Trans7 tidak ditemukan di os4.m3u."
              )

          # ==========================================
          # BANGUN os4.m3u FINAL
          # ==========================================

          final_playlist = f"""#EXTM3U

          #EXTINF:-1,Trans TV
          https://livestream.transtv.co.id/stream/live/ttv.m3u8

          #EXTINF:-1,Trans7
          {trans7_url}

          #EXTINF:-1,RCTI
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {rcti_url}

          #EXTINF:-1,MNCTV
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {mnctv_url}

          #EXTINF:-1,GTV
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {gtv_url}

          #EXTINF:-1,TVRI Nasional
          https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8

          #EXTINF:-1,Metro TV
          https://edge-medcom.streamized.net/live-edge/smil:metro.smil/playlist.m3u8
          """

          # Hilangkan indentasi awal dari f-string
          final_playlist = "\n".join(
              line.strip()
              for line in final_playlist.strip().splitlines()
          ) + "\n"

          Path("os4.m3u").write_text(
              final_playlist,
              encoding="utf-8"
          )

          print("=================================")
          print("os4.m3u BERHASIL DIBUAT")
          print("=================================")
          PY

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show final playlist
        run: |
          echo "================================="
          echo "ISI FINAL os4.m3u"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "URL ASLI RCTI"
          echo "================================="
          cat stream-rcti.txt

          echo ""
          echo "================================="
          echo "URL ASLI MNCTV"
          echo "================================="
          cat stream-mnctv.txt

          echo ""
          echo "================================="
          echo "URL ASLI GTV"
          echo "================================="
          cat stream-gtv.txt

          echo ""
          echo "================================="
          echo "URL TRANS7"
          echo "================================="
          grep -A1 "^#EXTINF:-1,Trans7" os4.m3u

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================="
          echo "STATUS GIT"
          echo "================================="

          git status --short

          echo ""
          echo "================================="
          echo "MENAMBAHKAN FILE"
          echo "================================="

          git add os4.m3u

          echo ""
          echo "================================="
          echo "PERUBAHAN YANG AKAN DI-COMMIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # PISAHKAN HEADER KE FILE STREAM
      # ==========================================

      - name: Update stream files RCTI MNCTV GTV
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          os4 = Path("os4.m3u")
          text = os4.read_text(encoding="utf-8")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          REFERRER = "https://www.rctiplus.com/"

          channels = {
              "RCTI": {
                  "file": "stream-rcti.txt",
                  "worker": "https://iptv-gateway.mfikriawan450.workers.dev/rcti",
              },
              "MNCTV": {
                  "file": "stream-mnctv.txt",
                  "worker": "https://iptv-gateway.mfikriawan450.workers.dev/mnctv",
              },
              "GTV": {
                  "file": "stream-gtv.txt",
                  "worker": "https://iptv-gateway.mfikriawan450.workers.dev/gtv",
              },
          }

          # ------------------------------------------
          # Ambil URL asli dari os4.m3u
          # ------------------------------------------

          def get_channel_url(channel):
              pattern = (
                  r"#EXTINF:-1," + re.escape(channel) +
                  r"\s+(.*?)"
                  r"(?=\n#EXTINF|\Z)"
              )

              match = re.search(pattern, text, re.S)

              if not match:
                  raise RuntimeError(
                      f"Channel {channel} tidak ditemukan di os4.m3u"
                  )

              block = match.group(1)

              # Buang baris EXT-VLC-OPT
              lines = []

              for line in block.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTVLCOPT:"):
                      continue

                  if line.startswith("#"):
                      continue

                  lines.append(line)

              if not lines:
                  raise RuntimeError(
                      f"URL {channel} tidak ditemukan di os4.m3u"
                  )

              return lines[-1]


          # ------------------------------------------
          # Buat stream-rcti.txt
          # stream-mnctv.txt
          # stream-gtv.txt
          # ------------------------------------------

          for channel, config in channels.items():
              url = get_channel_url(channel)

              content = (
                  "#EXTM3U\n"
                  f"#EXTINF:-1,{channel}\n"
                  f"#EXTVLCOPT:http-referrer={REFERRER}\n"
                  f"#EXTVLCOPT:http-user-agent={USER_AGENT}\n"
                  f"{url}\n"
              )

              Path(config["file"]).write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"{channel} URL terbaru:")
              print(url)
              print(f"Ditulis ke {config['file']}")
              print()


          # ------------------------------------------
          # Bersihkan os4.m3u
          #
          # RCTI/MNCTV/GTV:
          # hanya URL Worker
          # ------------------------------------------

          worker_urls = {
              "RCTI": channels["RCTI"]["worker"],
              "MNCTV": channels["MNCTV"]["worker"],
              "GTV": channels["GTV"]["worker"],
          }

          lines = text.splitlines()
          output = []

          current_channel = None

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("#EXTINF:-1,"):
                  channel_name = stripped.replace("#EXTINF:-1,", "", 1).strip()
                  current_channel = channel_name

                  output.append(line)
                  continue

              if current_channel in worker_urls:
                  if stripped.startswith("#EXTVLCOPT:"):
                      continue

                  # URL lama pada RCTI/MNCTV/GTV diganti Worker
                  if stripped and not stripped.startswith("#"):
                      output.append(worker_urls[current_channel])
                      current_channel = None
                      continue

              output.append(line)

          os4.write_text(
              "\n".join(output).rstrip() + "\n",
              encoding="utf-8"
          )

          print("=================================")
          print("os4.m3u berhasil dibersihkan.")
          print("RCTI/MNCTV/GTV sekarang hanya menggunakan URL Worker.")
          print("=================================")
          PY

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show updated playlist
        run: |
          echo "================================="
          echo "ISI os4.m3u"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "ISI stream-rcti.txt"
          echo "================================="
          cat stream-rcti.txt

          echo ""
          echo "================================="
          echo "ISI stream-mnctv.txt"
          echo "================================="
          cat stream-mnctv.txt

          echo ""
          echo "================================="
          echo "ISI stream-gtv.txt"
          echo "================================="
          cat stream-gtv.txt

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================="
          echo "STATUS GIT"
          echo "================================="

          git status --short

          echo ""
          echo "================================="
          echo "MENAMBAHKAN FILE"
          echo "================================="

          git add os4.m3u
          git add stream-rcti.txt
          git add stream-mnctv.txt
          git add stream-gtv.txt
          git add stream-trans7.txt

          echo ""
          echo "================================="
          echo "PERUBAHAN YANG AKAN DI-COMMIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="

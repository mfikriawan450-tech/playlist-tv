      - name: Build os4.m3u
        run: |
          python3 <<'PY'
          from pathlib import Path

          REFERRER = "https://www.rctiplus.com/"

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )

          def read_url(filename, channel):
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      f"{filename} tidak ditemukan."
                  )

              for line in path.read_text(
                  encoding="utf-8"
              ).splitlines():

                  line = line.strip()

                  if (
                      line.startswith("http://")
                      or line.startswith("https://")
                  ):
                      return line

              raise RuntimeError(
                  f"URL {channel} tidak ditemukan di {filename}."
              )

          # URL asli hasil update-rcti.mjs
          rcti_url = read_url(
              "stream-rcti.txt",
              "RCTI"
          )

          mnctv_url = read_url(
              "stream-mnctv.txt",
              "MNCTV"
          )

          gtv_url = read_url(
              "stream-gtv.txt",
              "GTV"
          )

          # URL asli hasil update-trans7.mjs
          os4_old = Path("os4.m3u")
          old_lines = os4_old.read_text(
              encoding="utf-8"
          ).splitlines()

          trans7_url = None

          for i, line in enumerate(old_lines):
              if line.strip() == "#EXTINF:-1,Trans7":
                  for next_line in old_lines[i + 1:]:
                      next_line = next_line.strip()

                      if (
                          next_line.startswith("http://")
                          or next_line.startswith("https://")
                      ):
                          trans7_url = next_line
                          break

                  if trans7_url:
                      break

          if not trans7_url:
              raise RuntimeError(
                  "URL Trans7 tidak ditemukan di os4.m3u."
              )

          # ==========================================
          # BUAT os4.m3u FINAL
          # ==========================================

          final_playlist = f"""#EXTM3U

          #EXTINF:-1,Trans TV
          https://livestream.transtv.co.id/stream/live/ttv.m3u8

          #EXTINF:-1,Trans7
          {trans7_url}

          #EXTINF:-1,RCTI
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {rcti_url}

          #EXTINF:-1,MNCTV
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {mnctv_url}

          #EXTINF:-1,GTV
          #EXTVLCOPT:http-referrer={REFERRER}
          #EXTVLCOPT:http-user-agent={USER_AGENT}
          {gtv_url}

          #EXTINF:-1,TVRI Nasional
          https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8

          #EXTINF:-1,Metro TV
          https://edge-medcom.streamized.net/live-edge/smil:metro.smil/playlist.m3u8
          """

          final_playlist = "\n".join(
              line.strip()
              for line in final_playlist.strip().splitlines()
          ) + "\n"

          os4_old.write_text(
              final_playlist,
              encoding="utf-8"
          )

          print("=================================")
          print("os4.m3u FINAL BERHASIL DIBUAT")
          print("=================================")
          PY

name: Update TV Streams

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # NODE
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # ==========================================
      # UPDATE RCTI / MNCTV / GTV
      # ==========================================

      - name: Update RCTI MNCTV GTV
        run: |
          node scripts/update-rcti.mjs

      # ==========================================
      # UPDATE TRANS7
      # ==========================================

      - name: Update Trans7
        run: |
          node scripts/update-trans7.mjs

      # ==========================================
      # FORMAT STREAM TXT
      #
      # Ketiga file hanya berisi URL ASLI
      # tanpa header / referer / metadata.
      # ==========================================

      - name: Format stream TXT
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = {
              "stream-rcti.txt": "RCTI",
              "stream-mnctv.txt": "MNCTV",
              "stream-gtv.txt": "GTV",
          }

          for filename, channel in files.items():
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      f"{filename} tidak ditemukan."
                  )

              lines = path.read_text(
                  encoding="utf-8"
              ).splitlines()

              url = None

              for line in lines:
                  line = line.strip()

                  if (
                      line.startswith("http://")
                      or line.startswith("https://")
                  ):
                      url = line

              if not url:
                  raise RuntimeError(
                      f"URL asli {channel} tidak ditemukan "
                      f"di {filename}."
                  )

              # Hanya URL asli
              path.write_text(
                  url + "\n",
                  encoding="utf-8"
              )

              print("=================================")
              print(channel)
              print("=================================")
              print("URL:")
              print(url)
              print(f"File: {filename}")
              print()

          print("=================================")
          print("SEMUA STREAM TXT BERISI URL ASLI")
          print("=================================")
          PY

      # ==========================================
      # PASTIKAN os4.m3u MENGGUNAKAN WORKER
      # + HEADER / REFERER TETAP DI os4.m3u
      # ==========================================

      - name: Update os4.m3u
        run: |
          cat > os4.m3u <<'EOF'
          #EXTM3U

          #EXTINF:-1,Trans TV
          https://livestream.transtv.co.id/stream/live/ttv.m3u8

          #EXTINF:-1,Trans7
          https://iptv-gateway.mfikriawan450.workers.dev/trans7

          #EXTINF:-1,RCTI
          #EXTVLCOPT:http-referrer=https://www.rctiplus.com/
          #EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
          https://iptv-gateway.mfikriawan450.workers.dev/rcti

          #EXTINF:-1,MNCTV
          #EXTVLCOPT:http-referrer=https://www.rctiplus.com/
          #EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
          https://iptv-gateway.mfikriawan450.workers.dev/mnctv

          #EXTINF:-1,GTV
          #EXTVLCOPT:http-referrer=https://www.rctiplus.com/
          #EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
          https://iptv-gateway.mfikriawan450.workers.dev/gtv

          #EXTINF:-1,TVRI Nasional
          https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8

          #EXTINF:-1,Metro TV
          https://edge-medcom.streamized.net/live-edge/smil:metro.smil/playlist.m3u8
          EOF

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show updated files
        run: |
          echo "================================="
          echo "ISI os4.m3u"
          echo "================================="
          cat os4.m3u

          echo ""
          echo "================================="
          echo "ISI stream-rcti.txt"
          echo "================================="
          cat stream-rcti.txt

          echo ""
          echo "================================="
          echo "ISI stream-mnctv.txt"
          echo "================================="
          cat stream-mnctv.txt

          echo ""
          echo "================================="
          echo "ISI stream-gtv.txt"
          echo "================================="
          cat stream-gtv.txt

          echo ""
          echo "================================="
          echo "ISI stream-trans7.txt"
          echo "================================="
          cat stream-trans7.txt

      # ==========================================
      # COMMIT & PUSH
      # ==========================================

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================="
          echo "STATUS GIT"
          echo "================================="

          git status --short

          echo ""
          echo "================================="
          echo "MENAMBAHKAN FILE"
          echo "================================="

          git add os4.m3u
          git add stream-rcti.txt
          git add stream-mnctv.txt
          git add stream-gtv.txt
          git add stream-trans7.txt

          echo ""
          echo "================================="
          echo "PERUBAHAN YANG AKAN DI-COMMIT"
          echo "================================="

          git diff --cached --stat
          git diff --cached

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Update TV streams"

          echo ""
          echo "================================="
          echo "PUSH"
          echo "================================="

          git push origin HEAD:main

          echo ""
          echo "================================="
          echo "PUSH BERHASIL"
          echo "================================="
